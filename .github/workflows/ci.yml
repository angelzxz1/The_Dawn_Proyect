# Checks every push: the types, lint, unit and component tests in one job;
# in another, the site is built and tested in a browser (Playwright,
# e2e/); a third tests the native engine and plugin hosting
# (crates/dawn-engine, crates/dawn-plugins, Rust).
# The desktop app itself is built by desktop.yml.
# A failed browser run keeps its report and traces as a download on the
# run's page.
# The jobs that install Chromium stay on Ubuntu 24.04: ubuntu-latest moved
# to Ubuntu 26 in October 2026, where Playwright 1.56 can't install
# Chromium's system libraries.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels the run still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Types, lint, unit and component tests
    # A pull request from this repository was already tested by its push;
    # only one from a fork needs its own run.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Install Chromium for the component tests
        run: npx playwright install --with-deps chromium
      - run: npm test

  browser:
    name: Build and browser tests
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install Chromium for the tests
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Keep the test report and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

  engine:
    name: Native engine and plugins (Rust)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      # Includes the parity tests against the JavaScript kernels' fixtures,
      # and the plugin scan against a real VST3 and CLAP plugin
      # (crates/dawn-test-plugin).
      - run: cargo test -p dawn-engine -p dawn-plugins
      - run: cargo clippy -p dawn-engine -p dawn-plugins -p dawn-test-plugin --all-targets -- -D warnings
      - run: cargo fmt -p dawn-engine -p dawn-plugins -p dawn-test-plugin --check
