[package]
name = "dawn-desktop"
# The app's version is package.json's (tauri.conf.json reads it); this one
# is only Cargo's.
version = "0.2.0"
description = "The Dawn Project as a desktop app."
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
name = "dawn_desktop_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Steinberg's ASIO drivers on Windows (cpal's ASIO backend, which needs the
# ASIO SDK and LLVM to build). Off until the ASIO licence agreement is
# signed: see docs/desktop.md.
asio = ["cpal/asio"]

[dependencies]
# Audio devices: Core Audio, WASAPI (and ASIO, above), ALSA.
cpal = "0.18"
dawn-engine = { path = "../crates/dawn-engine" }
dawn-plugins = { path = "../crates/dawn-plugins" }
# Lock-free queues between the app and the audio thread.
rtrb = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12", features = [] }
